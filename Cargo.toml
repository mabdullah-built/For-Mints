[package]
name = "kairox"
version = "0.7.0"
edition = "2024"
description = "Independent low-latency public SeaDrop mint execution CLI: on-chain and OpenSea-hosted mints, single- and multi-wallet, dry-run by default."
license = "MIT"

[lib]
name = "kairox"
path = "src/lib.rs"

[[bin]]
name = "kairox"
path = "src/main.rs"

[dependencies]
alloy-primitives = { version = "1.6.1", features = ["rlp"] }
alloy-rlp = { version = "0.3.16", features = ["derive"] }
alloy-sol-types = "1.6.1"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["ecdsa"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "http2"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.9.9"
url = { version = "2.5.8", features = ["serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
